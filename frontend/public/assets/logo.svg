<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="50%" stop-color="#0f192d"/>
      <stop offset="100%" stop-color="#162542"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad4)"/>
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <g filter="url(#glow4)">
    <!-- Hanger Hook (Gold/Champagne) -->
    <path d="M 256 120 
             C 278 120 294 136 294 158 
             C 294 178 280 192 266 200 
             L 256 208" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="16" 
          stroke-linecap="round"/>

    <!-- Central Atelier Pivot Sphere -->
    <circle cx="256" cy="214" r="8" fill="url(#goldGrad)"/>

    <!-- Flowing Continuous Ribbon / Hanger Silhouette -->
    <!-- Left shoulder sloping down, looping around into base bar -->
    <path d="M 256 216 
             C 230 236 170 274 126 298 
             C 114 305 120 324 134 324 
             L 378 324 
             C 392 324 398 305 386 298 
             C 342 274 282 236 256 216 
             Z" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="18" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Tailor's Tape / Stitched Accent Arc -->
    <path d="M 180 348 
             C 216 376 296 376 332 348" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linecap="round"
          stroke-dasharray="8 8"/>

    <!-- Minimalist Typography 'D' at bottom center -->
    <text x="256" y="420" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="34" 
          font-weight="600" 
          letter-spacing="10" 
          fill="url(#goldGrad)" 
          text-anchor="middle">DRESSLY</text>
  </g>
</svg>
