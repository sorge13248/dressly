<section class="modal-shell" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
  <header>
    <h2 id="confirm-title">{{ data.title }}</h2>
    <p>{{ data.message }}</p>
  </header>

  <footer>
    @if (data.showCancel !== false && data.cancelLabel !== null) {
      <button type="button" appButton variant="ghost" class="ghost" (click)="close()">{{ data.cancelLabel || 'Annulla' }}</button>
    }
    <button
      type="button"
      appButton
      [variant]="data.confirmVariant === 'primary' ? 'primary' : 'danger'"
      [class.danger]="data.confirmVariant !== 'primary'"
      [class.primary]="data.confirmVariant === 'primary'"
      (click)="confirm()"
    >
      {{ data.confirmLabel || 'Conferma' }}
    </button>
  </footer>
</section>
