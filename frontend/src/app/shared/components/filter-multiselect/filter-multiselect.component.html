<div class="dropdown-shell" cdkOverlayOrigin #trigger="cdkOverlayOrigin">
  <button
    type="button"
    class="trigger"
    [class.open]="open()"
    [attr.aria-expanded]="open()"
    (click)="togglePanel()"
    cdkOverlayOrigin
  >
    <span class="trigger-label">
      {{ label }}
      @if (selectedIds.length > 0) {
        <span class="count-badge">{{ selectedIds.length }}</span>
      }
    </span>
    <span class="trigger-value">{{ triggerLabel() }}</span>
    <span class="trigger-arrow">▾</span>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayMinWidth]="trigger.elementRef.nativeElement.getBoundingClientRect().width"
    (backdropClick)="closePanel()"
    (detach)="closePanel()"
  >
    <section class="panel" role="listbox" [attr.aria-label]="label" aria-multiselectable="true">
      <header class="panel-head">
        <strong>{{ label }}</strong>
        <button type="button" class="clear" (click)="clear()">Azzera</button>
      </header>

      <div class="panel-list">
        @for (option of options; track option.id) {
          <label class="option-row">
            <input
              type="checkbox"
              [checked]="selectedIds.includes(option.id)"
              (change)="onOptionToggle(option.id, $any($event.target).checked)"
            />
            @if (option.swatch) {
              <span class="swatch" [style.background]="option.swatch"></span>
            }
            @if (option.emoji) {
              <span class="emoji">{{ option.emoji }}</span>
            }
            <span class="text">{{ option.label }}</span>
          </label>
        }
      </div>
    </section>
  </ng-template>
</div>
