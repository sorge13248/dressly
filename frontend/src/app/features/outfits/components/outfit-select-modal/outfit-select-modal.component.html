<div
  class="modal-shell outfit-select-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="outfit-modal-title"
>
  <header class="modal-header">
    <div class="header-titles">
      <h2 id="outfit-modal-title">Scegli abbinamento</h2>
      <p>
        Aggiungi {{ clothesCount }} {{ clothesCount === 1 ? 'vestito selezionato' : 'vestiti selezionati' }} ad un abbinamento
      </p>
    </div>

    <button
      type="button"
      class="close-btn"
      (click)="close()"
      title="Chiudi"
      aria-label="Chiudi modale"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </header>

  <div class="modal-body-scroll">
    <app-outfit-grid
      mode="modal"
      [selectedClothesIds]="data.clothesIds"
      (outfitSelected)="onOutfitSelected($event)"
      (outfitCreated)="onOutfitCreated($event)"
    />
  </div>
</div>
