<form
  class="modal-shell"
  role="dialog"
  aria-modal="true"
  aria-labelledby="editor-title"
  (ngSubmit)="confirm()"
>
  <header>
    <h2 id="editor-title">
      {{ data.tabEmoji }}
      {{ data.mode === 'create' ? 'Nuovo valore' : 'Modifica valore' }}
    </h2>
    <p>{{ data.tabLabel }}</p>
  </header>

  <div class="form-grid">
    <label>
      <span>Nome</span>
      <input [formField]="modalForm.name" [class.field-error]="showError(modalForm.name())" />
      @if (showError(modalForm.name())) {
        <small class="field-error-text">{{ firstError(modalForm.name()) }}</small>
      }
    </label>

    @if (data.showSortOrder) {
      <label>
        <span>Ordine</span>
        <input
          [formField]="modalForm.sortOrder"
          inputmode="numeric"
          [class.field-error]="showError(modalForm.sortOrder())"
        />
        @if (showError(modalForm.sortOrder())) {
          <small class="field-error-text">{{ firstError(modalForm.sortOrder()) }}</small>
        }
      </label>
    }

    @if (data.isLocation) {
      <label>
        <span>Stanza</span>
        <select [formField]="modalForm.roomId" class="styled-select">
          <option value="">-- Nessuna stanza --</option>
          @for (room of data.roomOptions ?? []; track room.id) {
            <option [value]="room.id">{{ room.name }}</option>
          }
        </select>
      </label>
    }

    @if (data.isWashingProgram) {
      <label>
        <span>Temperatura (°C)</span>
        <input
          [formField]="modalForm.temperature"
          type="number"
          placeholder="es. 40 (0 per lavaggio a freddo)"
          [class.field-error]="showError(modalForm.temperature())"
        />
        @if (showError(modalForm.temperature())) {
          <small class="field-error-text">{{ firstError(modalForm.temperature()) }}</small>
        }
      </label>

      <label>
        <span>Centrifuga (giri/min)</span>
        <input
          [formField]="modalForm.spinSpeed"
          type="number"
          placeholder="es. 1000 (0 per nessuna centrifuga)"
          [class.field-error]="showError(modalForm.spinSpeed())"
        />
        @if (showError(modalForm.spinSpeed())) {
          <small class="field-error-text">{{ firstError(modalForm.spinSpeed()) }}</small>
        }
      </label>
    }

    @if (data.isDetergent) {
      <label>
        <span>Descrizione</span>
        <input
          [formField]="modalForm.description"
          placeholder="es. Per capi colorati e delicati"
        />
      </label>
    }

    @if (!data.hideExtra) {
      <label>
        <span>{{ data.extraLabel }}</span>
        @if (data.usesColorPicker) {
          <div class="color-input-row">
            <input
              type="color"
              class="color-picker"
              [value]="colorPickerValue()"
              (input)="onColorPicked($event)"
              aria-label="Seleziona colore"
            />
            <input [formField]="modalForm.extra" class="hex-input" placeholder="#5a9de8" />
          </div>
        } @else {
          <input [formField]="modalForm.extra" />
        }
      </label>
    }
  </div>

  <footer>
    <button type="button" appButton variant="ghost" class="ghost" (click)="close()">Annulla</button>
    <button type="submit" appButton variant="primary" class="primary">
      {{ data.mode === 'create' ? 'Crea' : 'Aggiorna' }}
    </button>
  </footer>
</form>
